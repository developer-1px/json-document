name: Publish v3 package

on:
  push:
    tags:
      - "json-document-v*"
      - "json-document-ajv-v*"
      - "json-document-zod-v*"
      - "json-document-react-hook-form-v*"
      - "json-document-react-v*"
      - "json-document-selection-v*"
      - "json-document-editing-v*"
      - "json-document-database-v*"
      - "json-document-tanstack-table-v*"
      - "json-document-web-v*"
      - "json-document-contenteditable-v*"
      - "json-document-collaboration-v*"
      - "json-document-contenteditable-collaboration-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-v3-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a tagged main commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Resolve release package
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-package.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify v3 release graph
        run: npm run release:check
      - name: Publish package
        env:
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish -w "$RELEASE_WORKSPACE" --tag "$RELEASE_DIST_TAG" --access public --provenance
